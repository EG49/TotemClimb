<style>
#erd svg.erDiagram .divider path { stroke-opacity: 0.5; }
#erd svg.erDiagram .row-rect-odd path,
#erd svg.erDiagram .row-rect-odd rect,
#erd svg.erDiagram .row-rect-even path,
#erd svg.erDiagram .row-rect-even rect { stroke: none !important; }
</style>
<div id="erd"></div>
<script type="module">
import mermaid from 'https://esm.sh/mermaid@11/dist/mermaid.esm.min.mjs';
const dark = matchMedia('(prefers-color-scheme: dark)').matches;
await document.fonts.ready;
mermaid.initialize({
  startOnLoad: false,
  theme: 'base',
  fontFamily: '"anthropic-sans", sans-serif',
  themeVariables: {
    darkMode: dark,
    fontSize: '13px',
    fontFamily: '"anthropic-sans", sans-serif',
    lineColor: dark ? '#9c9a92' : '#73726c',
    textColor: dark ? '#c2c0b6' : '#3d3d3a',
  },
});
const src = `erDiagram
  USUARIOS ||--o{ FACTURA : genera
  USUARIOS ||--o{ MEMBRESIAS : posee
  FACTURA ||--|{ DETALLE : contiene
  FACTURA ||--o{ MEMBRESIAS : origina
  PRODUCTOS ||--o{ DETALLE : aparece_en
  PRODUCTOS ||--o{ MEMBRESIAS : define
  MEMBRESIAS |o--o| MEMBRESIAS : pareja_con
  CATEGORIAS_EVENTO ||--o{ EVENTOS : clasifica
  USUARIOS {
    int Id_Usuario PK
    string Nombre
    string Apellido
    string Cedula
    date Fecha_Nacimiento
    string Correo
    string Telefono
    string Genero
    string Contacto_Emergencia
    string Contrato_Ruta
    date Vigente_Hasta
    date Fecha_Registro
  }
  PRODUCTOS {
    int Id_Producto PK
    string Nombre
    string Categoria
    string Tipo
    float Precio
    int Stock
    boolean Es_Membresia
    string Tipo_Membresia
    int Dias_Incluidos
  }
  FACTURA {
    int Id_Factura PK
    int Id_Usuario FK
    date Fecha
    string Metodo_Pago
    float Descuento_Porcentaje
    float Subtotal
    float IVA
    float Total
    string Estado
    string Motivo_Anulacion
  }
  DETALLE {
    int Id_Detalle PK
    int Id_Factura FK
    int Id_Producto FK
    int Cantidad
    float Precio_Unitario
    float Subtotal
  }
  MEMBRESIAS {
    int Id_Membresia PK
    int Id_Usuario FK
    int Id_Producto FK
    int Id_Factura FK
    date Fecha_Inicio
    date Fecha_Fin
    int Dias_Totales
    int Dias_Restantes
    string Estado
    int Id_Membresia_Pareja FK
  }
  CATEGORIAS_EVENTO {
    int Id_Categoria PK
    string Nombre
    string Color
  }
  EVENTOS {
    int Id_Evento PK
    string Titulo
    int Id_Categoria FK
    date Fecha
    time Hora_Inicio
    time Hora_Fin
    string Descripcion
    int Cupo_Maximo
  }`;
const { svg } = await mermaid.render('erd-svg', src);
document.getElementById('erd').innerHTML = svg;

document.querySelectorAll('#erd svg.erDiagram .node').forEach(node => {
  const firstPath = node.querySelector('path[d]');
  if (!firstPath) return;
  const d = firstPath.getAttribute('d');
  const nums = d.match(/-?[\d.]+/g)?.map(Number);
  if (!nums || nums.length < 8) return;
  const xs = [nums[0], nums[2], nums[4], nums[6]];
  const ys = [nums[1], nums[3], nums[5], nums[7]];
  const x = Math.min(...xs), y = Math.min(...ys);
  const w = Math.max(...xs) - x, h = Math.max(...ys) - y;
  const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
  rect.setAttribute('x', x); rect.setAttribute('y', y);
  rect.setAttribute('width', w); rect.setAttribute('height', h);
  rect.setAttribute('rx', '8');
  for (const a of ['fill', 'stroke', 'stroke-width', 'class', 'style']) {
    if (firstPath.hasAttribute(a)) rect.setAttribute(a, firstPath.getAttribute(a));
  }
  firstPath.replaceWith(rect);
});

document.querySelectorAll('#erd svg.erDiagram .row-rect-odd path, #erd svg.erDiagram .row-rect-even path').forEach(p => {
  p.setAttribute('stroke', 'none');
});
</script>
