<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Iniciar sesión — Totem Climb Gym</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Shadows+Into+Light+Two&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='css/totem.css') }}">
</head>
<body>
<div class="login-wrap">
  <div class="login-card">
    <div class="login-logo">
      <img src="{{ url_for('static', filename='img/totem-logo.png') }}" alt="Totem Climb Gym">
    </div>
    <div class="login-title">Iniciar sesión</div>
    <div class="login-sub">Sistema de membresías y facturación</div>

    {% with mensajes = get_flashed_messages(with_categories=true) %}
      {% for categoria, mensaje in mensajes %}
        <div class="flash {{ categoria }}">{{ mensaje }}</div>
      {% endfor %}
    {% endwith %}

    <form method="post" action="{{ url_for('auth.login') }}">
      <div class="field">
        <label for="usuario">Usuario</label>
        <input id="usuario" name="usuario" type="text" value="{{ usuario }}"
               autocomplete="username" autofocus required>
      </div>
      <div class="field">
        <label for="password">Contraseña</label>
        <input id="password" name="password" type="password"
               autocomplete="current-password" required>
      </div>
      <button type="submit" class="btn-primary">Entrar</button>
    </form>

    <div class="login-pie">Totem = Familia</div>
  </div>
</div>
</body>
</html>
